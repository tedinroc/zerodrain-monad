[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.31"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_testnet_backup = "https://rpc-testnet.monadinfra.com"
