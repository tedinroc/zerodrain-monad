name: ZeroDrain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Foundry Format, Build & 15 Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry (pinned v1.9.0)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      - name: Install Pinned Foundry Dependencies
        run: forge install foundry-rs/forge-std@v1.17.0 OpenZeppelin/openzeppelin-contracts@v5.7.0

      - name: Check Solidity Formatting
        run: forge fmt --check

      - name: Build Contracts
        run: forge build --sizes

      - name: Run 15 Security & Fork Tests (Monad Testnet Fork for Native 0x0100)
        run: forge test -vv --fork-url https://testnet-rpc.monad.xyz

  web:
    name: Next.js Typecheck, Lint & Static Export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Check
        run: npx tsc --noEmit

      - name: ESLint Check
        run: npm run lint

      - name: Verify Served JS Action Bundles Exist
        run: |
          test -f public/bundles/vault-action.clean.js
          test -f public/bundles/vault-action.hijacked.js

      - name: Build Static Export
        run: npm run build
